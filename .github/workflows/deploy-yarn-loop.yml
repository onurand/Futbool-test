name: Deploy Yarn Loop to GitHub Pages

on:
  push:
    branches:
      - claude/yarn-loop-oyunu-clone-cpkm33
      - main
    paths:
      - "yarn-loop/**"
      - ".github/workflows/deploy-yarn-loop.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish yarn-loop to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./yarn-loop
          commit_message: "Deploy Yarn Loop"

      - name: Enable Pages (source gh-pages branch, idempotent)
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Pages API: HTTP $code"
          cat /tmp/pages.json
          # 201 = yeni açıldı, 409 = zaten açık; ikisi de tamam
          [ "$code" = "201" ] || [ "$code" = "409" ]

      - name: Wait until the site is live
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "deneme $i: $url -> HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "Site 5 dakika içinde canlıya çıkmadı" >&2
          exit 1
