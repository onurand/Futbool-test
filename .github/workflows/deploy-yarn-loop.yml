name: Deploy Yarn Loop to GitHub Pages

on:
  push:
    branches:
      - claude/yarn-loop-oyunu-clone-cpkm33
      - main
    paths:
      - "yarn-loop/**"
      - ".github/workflows/deploy-yarn-loop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish yarn-loop to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./yarn-loop
          commit_message: "Deploy Yarn Loop"
