[project]
name = "futbool"
version = "0.0.1"
description = "Multi-agent football analyst (John, Carlos, Hans, Emre) with Claude tool use, MCP servers, market-aware predictions, and Stripe-based league subscriptions."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "supabase>=2.9",
    "redis>=5.2",
    "asyncpg>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "stripe>=11.2",
    "python-jose[cryptography]>=3.3",
    "tenacity>=9.0",
    "structlog>=24.4",
    "mcp>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
