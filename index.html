<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#38305e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yarn Loop">
<title>Yarn Loop</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <header id="hud">
    <button id="btn-prev" class="icon-btn" title="Önceki seviye">‹</button>
    <div id="hud-center">
      <div id="level-label">Seviye 1</div>
      <div id="mistake-label"></div>
    </div>
    <button id="btn-restart" class="icon-btn" title="Yeniden başlat">⟳</button>
  </header>

  <div id="stage">
    <canvas id="canvas"></canvas>

    <div id="overlay" class="hidden">
      <div id="overlay-card">
        <h1 id="overlay-title">Tebrikler!</h1>
        <div id="overlay-stars"></div>
        <p id="overlay-sub"></p>
        <div id="overlay-buttons">
          <button id="btn-replay" class="btn secondary">Tekrar Oyna</button>
          <button id="btn-next" class="btn primary">Sonraki Seviye ›</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="hint">Bobine dokun — kendi rengindeki açık ilmekleri söksün 🧶</footer>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
